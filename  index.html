<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>测产公式设计器</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--text:#172019;--sub:#6b756d;--line:#dce4dd;--accent:#2f6f45;--soft:#eaf3ed;--danger:#b33b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
.app{max-width:900px;margin:auto;padding:14px 12px 40px}
h1{font-size:22px;margin:2px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--danger)}
select,input{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.flex1{flex:1;min-width:0}
.small{font-size:12px;color:var(--sub);line-height:1.5}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.opbtn{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700}
.builder{border:1px dashed #bbc8be;border-radius:14px;padding:12px;background:#fbfcfb}
.tokens{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:48px;margin-top:10px}
.token{display:flex;align-items:center;gap:5px;background:var(--soft);border:1px solid #cdded2;border-radius:10px;padding:7px 8px}
.token.op{background:#fff;font-weight:800}
.token.num{background:#f2f2f2}
.token button{border:0;background:transparent;color:#999}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-card{border:1px solid var(--line);border-radius:12px;padding:10px}
.input-card label{font-size:13px;color:var(--sub);display:block;margin-bottom:5px}
.formula-card{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px}
.formula-head{cursor:pointer}
.formula-head:active{background:#f5faf6}
.formula-use{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.formula-use-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.formula-use-item label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.formula-use-result{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px}
@media(max-width:650px){.formula-use-grid{grid-template-columns:1fr}}
.result{background:var(--soft);border:1px solid #cbded0;border-radius:12px;padding:11px;margin-bottom:8px}
.value{font-size:24px;font-weight:800}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>测产公式设计器</h1>

<div class="card">
  <h2>公式名称</h2>
  <div class="row">
    <select id="setSelect" class="flex1"></select>
    <button id="addSet" class="btn">新增</button>
    <button id="renameSet" class="btn">重命名</button>
    <button id="deleteSet" class="btn danger">删除</button>
  </div>
</div>

<div class="card">
  <h2>新增公式</h2>
  <div class="small">先添加项目名称或固定数字，再点＋－×÷连接。已经建立的公式，直接点击它就能加入当前新公式。</div>

  <div class="row" style="margin-top:10px">
    <input id="resultName" class="flex1" placeholder="结果名称，例如：潮粮亩产">
    <input id="resultUnit" style="width:160px" placeholder="单位，例如：公斤/亩">
  </div>

  <div class="row" style="margin-top:10px">
    <input id="itemName" class="flex1" placeholder="项目名称，例如：穴数/平方米">
    <input id="fixedNumber" style="width:170px" inputmode="decimal" placeholder="固定数字，例如：667">
    <button id="addToken" class="btn">添加</button>
  </div>

  <div class="ops">
    <button class="opbtn" data-op="+">＋</button>
    <button class="opbtn" data-op="-">－</button>
    <button class="opbtn" data-op="*">×</button>
    <button class="opbtn" data-op="/">÷</button>
  </div>

  <div class="builder">
    <div id="tokens" class="tokens"></div>
    <div class="row" style="margin-top:10px">
      <button id="finish" class="btn primary">完成并生成</button>
      <button id="clearBuilder" class="btn">清空当前</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>已建立公式</h2>
  <div id="formulaList"></div>
</div>

<div class="card">
  <h2>输入数据</h2>
  <div id="inputs" class="grid"></div>
</div>

<div class="card">
  <h2>计算结果</h2>
  <div id="results"></div>
</div>
</div>

<script>
(function(){
  var KEY='yield_formula_local_v1';

  function uid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
  function defaultState(){
    var sid=uid('set');
    return {
      active:sid,
      sets:[{
        id:sid,
        name:'水稻测产',
        formulas:[{
          id:uid('f'),
          name:'潮粮亩产',
          unit:'公斤/亩',
          tokens:[
            {type:'var',name:'穴数/平方米'},
            {type:'op',value:'*'},
            {type:'var',name:'平均克数/穴'},
            {type:'op',value:'*'},
            {type:'num',value:667},
            {type:'op',value:'/'},
            {type:'num',value:1000}
          ]
        }],
        values:{'穴数/平方米':'','平均克数/穴':''}
      }]
    };
  }

  function load(){
    try{
      var x=JSON.parse(localStorage.getItem(KEY));
      if(x&&x.sets&&x.sets.length)return x;
    }catch(e){}
    return defaultState();
  }

  var state=load();
  var builder=[];

  function save(){localStorage.setItem(KEY,JSON.stringify(state));}
  function current(){
    for(var i=0;i<state.sets.length;i++) if(state.sets[i].id===state.active) return state.sets[i];
    state.active=state.sets[0].id;
    return state.sets[0];
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function exprText(tokens){
    var out=[];
    for(var i=0;i<tokens.length;i++){
      var t=tokens[i];
      if(t.type==='var') out.push('['+t.name+']');
      else if(t.type==='ref') out.push('['+t.name+']');
      else if(t.type==='num') out.push(String(t.value));
      else out.push(t.value==='*'?'×':t.value==='/'?'÷':t.value);
    }
    return out.join(' ');
  }
  function varNames(){
    var names=[], fs=current().formulas;
    for(var i=0;i<fs.length;i++){
      for(var j=0;j<fs[i].tokens.length;j++){
        var t=fs[i].tokens[j];
        if(t.type==='var'&&names.indexOf(t.name)<0)names.push(t.name);
      }
    }
    return names;
  }

  function renderSets(){
    var sel=document.getElementById('setSelect');
    sel.innerHTML='';
    for(var i=0;i<state.sets.length;i++){
      var o=document.createElement('option');
      o.value=state.sets[i].id;
      o.textContent=state.sets[i].name;
      if(o.value===state.active)o.selected=true;
      sel.appendChild(o);
    }
  }

  function renderBuilder(){
    var box=document.getElementById('tokens');
    box.innerHTML='';
    if(!builder.length){
      box.innerHTML='<div class="small">还没有内容。</div>';
      return;
    }
    for(let i=0;i<builder.length;i++){
      var t=builder[i];
      var d=document.createElement('div');
      d.className='token '+(t.type==='op'?'op':t.type==='num'?'num':'');
      d.innerHTML='<span>'+esc((t.type==='var'||t.type==='ref')?t.name:t.type==='num'?t.value:(t.value==='*'?'×':t.value==='/'?'÷':t.value))+'</span><button type="button">×</button>';
      d.querySelector('button').onclick=function(){builder.splice(i,1);renderBuilder();};
      box.appendChild(d);
    }
  }


  function findFormulaByName(name){
    var fs=current().formulas;
    for(var i=0;i<fs.length;i++) if(fs[i].name===name)return fs[i];
    return null;
  }

  function collectRawVarsForFormula(formula,seen){
    seen=seen||{};
    var out=[];
    if(!formula||seen[formula.name])return out;
    seen[formula.name]=true;
    for(var i=0;i<formula.tokens.length;i++){
      var t=formula.tokens[i];
      if(t.type==='var'){
        if(out.indexOf(t.name)<0)out.push(t.name);
      }else if(t.type==='ref'){
        var sub=findFormulaByName(t.name);
        var subVars=collectRawVarsForFormula(sub,seen);
        for(var j=0;j<subVars.length;j++) if(out.indexOf(subVars[j])<0)out.push(subVars[j]);
      }
    }
    return out;
  }

  function evalFormulaRecursive(formula,ctx,seen){
    seen=seen||{};
    if(!formula||seen[formula.name])return null;
    seen[formula.name]=true;
    var expr='';
    for(var i=0;i<formula.tokens.length;i++){
      var t=formula.tokens[i];
      if(t.type==='num')expr+=String(Number(t.value));
      else if(t.type==='op')expr+=t.value;
      else if(t.type==='var'){
        var v=Number(ctx[t.name]);
        if(!isFinite(v))return null;
        expr+='('+v+')';
      }else if(t.type==='ref'){
        var sub=findFormulaByName(t.name);
        var rv=evalFormulaRecursive(sub,ctx,Object.assign({},seen));
        if(rv===null)return null;
        expr+='('+rv+')';
      }
    }
    try{
      var val=Function('"use strict";return ('+expr+')')();
      return isFinite(val)?val:null;
    }catch(e){return null;}
  }

  function renderFormulas(){
    var box=document.getElementById('formulaList');
    box.innerHTML='';
    var s=current(),fs=s.formulas;
    if(!fs.length){
      box.innerHTML='<div class="small">还没有建立公式。</div>';
      return;
    }
    if(!s.openFormulaId)s.openFormulaId='';

    for(let i=0;i<fs.length;i++){
      var f=fs[i];
      var open=s.openFormulaId===f.id;
      var d=document.createElement('div');
      d.className='formula-card';

      d.innerHTML=
        '<div class="formula-head">'+
          '<div class="row" style="justify-content:space-between">'+
            '<strong>'+(open?'▼ ':'▶ ')+esc(f.name)+'</strong>'+
            '<div class="row">'+
              '<button class="btn useInNew" type="button">用于新公式</button>'+
              '<button class="btn editFormula" type="button">修改</button>'+
              '<button class="btn danger deleteFormula" type="button">删除</button>'+
            '</div>'+
          '</div>'+
          '<div class="small" style="margin-top:7px">'+esc(exprText(f.tokens))+' = '+esc(f.name)+'</div>'+
        '</div>'+
        (open?'<div class="formula-use"></div>':'');

      d.querySelector('.formula-head').onclick=function(e){
        if(e.target.closest('button'))return;
        s.openFormulaId=(s.openFormulaId===f.id?'':f.id);
        save();
        renderFormulas();
      };

      d.querySelector('.useInNew').onclick=function(e){
        e.stopPropagation();
        if(builder.length && builder[builder.length-1].type!=='op'){
          alert('请先选择＋－×÷，再使用已建立公式。');
          return;
        }
        builder.push({type:'ref',name:f.name});
        renderBuilder();
        document.getElementById('resultName').scrollIntoView({behavior:'smooth',block:'center'});
      };

      d.querySelector('.deleteFormula').onclick=function(e){
        e.stopPropagation();
        if(confirm('删除这个公式吗？')){
          fs.splice(i,1);
          if(s.openFormulaId===f.id)s.openFormulaId='';
          save();renderAll();
        }
      };

      d.querySelector('.editFormula').onclick=function(e){
        e.stopPropagation();
        document.getElementById('resultName').value=f.name;
        document.getElementById('resultUnit').value=f.unit||'';
        builder=JSON.parse(JSON.stringify(f.tokens));
        fs.splice(i,1);
        if(s.openFormulaId===f.id)s.openFormulaId='';
        save();renderAll();
        window.scrollTo(0,0);
      };

      if(open){
        var use=d.querySelector('.formula-use');
        var vars=collectRawVarsForFormula(f,{});
        var html='<div class="small">直接填写下面的数据，即可使用这个公式：</div><div class="formula-use-grid">';
        if(!s.values)s.values={};
        for(var vi=0;vi<vars.length;vi++){
          var vn=vars[vi];
          if(s.values[vn]===undefined)s.values[vn]='';
          html+='<div class="formula-use-item"><label>'+esc(vn)+'</label><input type="number" step="any" inputmode="decimal" data-var="'+esc(vn)+'" value="'+esc(s.values[vn])+'" style="width:100%"></div>';
        }
        html+='</div><div class="formula-use-result"><div class="small">计算结果</div><div class="value formula-inline-value">— <span style="font-size:14px">'+esc(f.unit||'')+'</span></div></div>';
        use.innerHTML=html;

        var updateInline=function(){
          var val=evalFormulaRecursive(f,s.values,{});
          use.querySelector('.formula-inline-value').innerHTML=(val===null?'—':val.toFixed(2))+' <span style="font-size:14px">'+esc(f.unit||'')+'</span>';
        };
        var inputs=use.querySelectorAll('input[data-var]');
        for(var ii=0;ii<inputs.length;ii++){
          inputs[ii].oninput=function(e){
            s.values[e.target.getAttribute('data-var')]=e.target.value;
            save();
            updateInline();
            renderResults();
          };
        }
        updateInline();
      }

      box.appendChild(d);
    }
  }

  function renameVariableEverywhere(oldName,newName){
    if(!oldName||!newName||oldName===newName)return;
    var s=current();
    for(var i=0;i<s.formulas.length;i++){
      for(var j=0;j<s.formulas[i].tokens.length;j++){
        var t=s.formulas[i].tokens[j];
        if(t.type==='var'&&t.name===oldName)t.name=newName;
      }
    }
    if(!s.values)s.values={};
    if(s.values[newName]===undefined)s.values[newName]=s.values[oldName];
    delete s.values[oldName];
  }

  function deleteVariableEverywhere(name){
    var s=current();
    for(var i=0;i<s.formulas.length;i++){
      s.formulas[i].tokens=s.formulas[i].tokens.filter(function(t){
        return !(t.type==='var'&&t.name===name);
      });
      // Remove dangling operators at beginning/end and duplicate operators.
      var cleaned=[];
      for(var j=0;j<s.formulas[i].tokens.length;j++){
        var t=s.formulas[i].tokens[j];
        if(t.type==='op'){
          if(!cleaned.length||cleaned[cleaned.length-1].type==='op')continue;
        }
        cleaned.push(t);
      }
      if(cleaned.length&&cleaned[cleaned.length-1].type==='op')cleaned.pop();
      s.formulas[i].tokens=cleaned;
    }
    if(s.values)delete s.values[name];
  }

  function renderInputs(){
    var box=document.getElementById('inputs');
    box.innerHTML='';
    var s=current(), names=varNames();
    if(!names.length){
      box.innerHTML='<div class="small">建立公式后，这里会自动出现输入项。</div>';
      return;
    }
    if(!s.values)s.values={};
    for(let i=0;i<names.length;i++){
      var name=names[i];
      if(s.values[name]===undefined)s.values[name]='';
      var d=document.createElement('div');
      d.className='input-card';
      d.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><label style="margin:0">'+esc(name)+'</label><div class="row"><button class="btn editInput" type="button">修改</button><button class="btn danger deleteInput" type="button">删除</button></div></div><input type="number" step="any" inputmode="decimal" value="'+esc(s.values[name])+'" style="margin-top:8px;width:100%">';
      d.querySelector('input').oninput=function(e){
        s.values[name]=e.target.value;
        save();
        renderResults();
      };
      d.querySelector('.editInput').onclick=function(){
        var newName=prompt('修改输入栏名称：',name);
        if(!newName)return;
        newName=newName.trim();
        if(!newName)return;
        renameVariableEverywhere(name,newName);
        save();
        renderAll();
      };
      d.querySelector('.deleteInput').onclick=function(){
        if(!confirm('删除“'+name+'”吗？引用它的公式也会同步移除这个项目。'))return;
        deleteVariableEverywhere(name);
        save();
        renderAll();
      };
      box.appendChild(d);
    }
  }

  function calcFormula(f,ctx){
    var expr='';
    for(var i=0;i<f.tokens.length;i++){
      var t=f.tokens[i];
      if(t.type==='num')expr+=String(Number(t.value));
      else if(t.type==='op')expr+=t.value;
      else if(t.type==='ref'){
        var rv=Number(ctx[t.name]);
        if(!isFinite(rv))return null;
        expr+='('+rv+')';
      }else{
        var v=Number(ctx[t.name]);
        if(!isFinite(v))return null;
        expr+='('+v+')';
      }
    }
    if(!expr)return null;
    try{
      var val=Function('"use strict";return ('+expr+')')();
      return isFinite(val)?val:null;
    }catch(e){return null;}
  }

  function renderResults(){
    var box=document.getElementById('results');
    box.innerHTML='';
    var s=current(),ctx={},k;
    for(k in s.values)ctx[k]=s.values[k];
    if(!s.formulas.length){
      box.innerHTML='<div class="small">暂无计算结果。</div>';
      return;
    }
    for(var i=0;i<s.formulas.length;i++){
      var f=s.formulas[i];
      var v=calcFormula(f,ctx);
      if(v!==null)ctx[f.name]=v;
      var d=document.createElement('div');
      d.className='result';
      d.innerHTML='<div class="small">'+esc(f.name)+'</div><div class="value">'+(v===null?'—':v.toFixed(2))+' <span style="font-size:14px">'+esc(f.unit||'')+'</span></div>';
      box.appendChild(d);
    }
  }

  function renderAll(){
    renderSets();
    renderBuilder();
    renderFormulas();
    renderInputs();
    renderResults();
  }

  document.getElementById('setSelect').onchange=function(e){
    state.active=e.target.value;save();renderAll();
  };
  document.getElementById('addSet').onclick=function(){
    var name=prompt('请输入新的公式名称：','新公式');
    if(!name)return;
    var s={id:uid('set'),name:name.trim(),formulas:[],values:{}};
    state.sets.push(s);state.active=s.id;save();renderAll();
  };
  document.getElementById('renameSet').onclick=function(){
    var s=current(),name=prompt('重命名：',s.name);
    if(!name)return;s.name=name.trim();save();renderSets();
  };
  document.getElementById('deleteSet').onclick=function(){
    if(state.sets.length<=1){alert('至少保留一个公式名称。');return;}
    if(!confirm('确定删除当前公式名称及其全部公式吗？'))return;
    var id=state.active;
    state.sets=state.sets.filter(function(s){return s.id!==id;});
    state.active=state.sets[0].id;save();renderAll();
  };
  document.getElementById('addToken').onclick=function(){
    var n=document.getElementById('itemName').value.trim();
    var num=document.getElementById('fixedNumber').value.trim();
    if(n&&num){alert('项目名称和固定数字二选一。');return;}
    if(n){
      builder.push({type:'var',name:n});
      document.getElementById('itemName').value='';
    }else if(num!==''&&!isNaN(Number(num))){
      builder.push({type:'num',value:Number(num)});
      document.getElementById('fixedNumber').value='';
    }else{
      alert('请输入项目名称或固定数字。');return;
    }
    renderBuilder();
  };
  var ops=document.querySelectorAll('.opbtn');
  for(var i=0;i<ops.length;i++){
    ops[i].onclick=function(){
      if(!builder.length||builder[builder.length-1].type==='op'){alert('请先添加一个项目或数字。');return;}
      builder.push({type:'op',value:this.getAttribute('data-op')});
      renderBuilder();
    };
  }
  document.getElementById('clearBuilder').onclick=function(){
    builder=[];
    document.getElementById('resultName').value='';
    document.getElementById('resultUnit').value='';
    renderBuilder();
  };
  document.getElementById('finish').onclick=function(){
    var name=document.getElementById('resultName').value.trim();
    var unit=document.getElementById('resultUnit').value.trim();
    if(!name){alert('请填写结果名称。');return;}
    if(!builder.length){alert('请先建立公式。');return;}
    if(builder[builder.length-1].type==='op'){alert('公式最后不能是运算符。');return;}

    var s=current();
    s.formulas.push({id:uid('f'),name:name,unit:unit,tokens:JSON.parse(JSON.stringify(builder))});
    if(!s.values)s.values={};
    for(var i=0;i<builder.length;i++){
      var t=builder[i];
      if(t.type==='var'&&s.values[t.name]===undefined)s.values[t.name]='';
    }
    builder=[];
    document.getElementById('resultName').value='';
    document.getElementById('resultUnit').value='';
    save();renderAll();
  };

  renderAll();
})();
</script>
</body>
</html>
