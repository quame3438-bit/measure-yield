<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>测产公式设计器</title>
<style>
:root{
  --bg:#f5f7f4;--card:#fff;--text:#172019;--sub:#69736b;--line:#dce4dd;
  --accent:#2f6f45;--soft:#eaf3ed;--danger:#b33a3a;--shadow:0 8px 24px rgba(25,55,35,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
.app{max-width:920px;margin:auto;padding:14px 12px 42px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:2px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.small{font-size:12px;color:var(--sub);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--danger)}
select,input{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;outline:none}
select:focus,input:focus{border-color:#8db49a;box-shadow:0 0 0 3px rgba(47,111,69,.08)}
.flex1{flex:1;min-width:0}
.cloud-login input{flex:1 1 180px;min-width:0}
.status{font-size:13px;color:var(--sub);margin-top:8px}
.status.ok{color:var(--accent);font-weight:600}
.formula-name-row select{flex:1;min-width:160px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.opbtn{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700;cursor:pointer}
.builder{border:1px dashed #bfcbbf;border-radius:14px;padding:12px;background:#fbfcfb}
.tokens{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:48px}
.token{display:flex;align-items:center;gap:5px;background:var(--soft);border:1px solid #cfdfd4;border-radius:10px;padding:7px 8px}
.token.fixed{background:#f2f2f2;border-color:#ddd}
.token.op{background:#fff;border-color:#d6ddd7;font-weight:800}
.token input{width:140px;padding:7px}
.token button{border:0;background:transparent;color:#999;cursor:pointer;padding:2px 4px}
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.formula-list{display:flex;flex-direction:column;gap:9px}
.formula-card{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}
.formula-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}
.formula-expression{font-size:14px;color:#3d4a40;line-height:1.7;word-break:break-word}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-card{border:1px solid var(--line);border-radius:12px;padding:10px}
.input-card label{font-size:13px;color:var(--sub);display:block;margin-bottom:5px}
.result{background:var(--soft);border:1px solid #cadfd0;border-radius:13px;padding:11px;margin-bottom:9px}
.result-name{font-size:13px;color:#496250}
.result-value{font-size:25px;font-weight:800;margin-top:3px}
.mutedbox{background:#fafafa;border-radius:10px;padding:10px;color:var(--sub);font-size:12px;line-height:1.6}
[hidden]{display:none!important}
@media(max-width:680px){
  .add-row,.inputs{grid-template-columns:1fr}
  .formula-name-row{align-items:stretch}
  .formula-name-row .btn{flex:1}
}
</style>
</head>
<body>
<div class="app">
  <h1>测产公式设计器</h1>

  <section class="card">
    <h2>☁️ 云同步</h2>
    <form id="cloudLogin" class="row cloud-login">
      <input id="cloudEmail" type="email" placeholder="邮箱" autocomplete="username">
      <input id="cloudPassword" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn primary" type="submit">登录</button>
    </form>
    <div id="cloudAccount" class="row" hidden>
      <span id="cloudUserText" class="small"></span>
      <button id="syncBtn" class="btn" type="button">立即同步</button>
      <button id="logoutBtn" class="btn" type="button">退出登录</button>
    </div>
    <div id="cloudStatus" class="status">未登录，当前内容保存在本机。</div>
  </section>

  <section class="card">
    <h2>公式名称</h2>
    <div class="row formula-name-row">
      <select id="formulaSelect"></select>
      <button id="newFormulaSet" class="btn">新增</button>
      <button id="renameFormulaSet" class="btn">重命名</button>
      <button id="deleteFormulaSet" class="btn danger">删除</button>
    </div>
  </section>

  <section class="card">
    <h2>新增公式</h2>
    <div class="small">先添加“项目/固定数字”，再用下面的＋－×÷连接。项目会自动变成下方的输入框；固定数字不会生成输入框。</div>

    <div class="ops">
      <button class="opbtn" data-op="+">＋</button>
      <button class="opbtn" data-op="-">－</button>
      <button class="opbtn" data-op="*">×</button>
      <button class="opbtn" data-op="/">÷</button>
    </div>

    <div class="builder">
      <div class="row">
        <input id="resultName" class="flex1" placeholder="结果名称，例如：潮粮亩产">
        <input id="resultUnit" style="width:150px" placeholder="单位，例如：公斤/亩">
      </div>

      <div class="add-row">
        <input id="itemName" placeholder="项目名称，例如：穴数/平方米">
        <input id="fixedNumber" inputmode="decimal" placeholder="或输入固定数字，例如：667">
        <button id="addItemBtn" class="btn">添加</button>
      </div>

      <div class="tokens" id="tokens"></div>

      <div class="row" style="margin-top:10px">
        <button id="finishFormula" class="btn primary">完成并生成</button>
        <button id="clearBuilder" class="btn">清空当前</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>已建立公式</h2>
    <div id="formulaList" class="formula-list"></div>
  </section>

  <section class="card">
    <h2>输入数据</h2>
    <div id="inputArea" class="inputs"></div>
  </section>

  <section class="card">
    <h2>计算结果</h2>
    <div id="results"></div>
  </section>
</div>

<script>
const STORAGE_KEY='yield_formula_designer_v1';
const CLOUD_PROJECT_URL="https://braarnzywbodyfdclodc.supabase.co";
const CLOUD_PUBLISHABLE_KEY="sb_publishable_JecnrG-198PERwUD5lFhaQ_wc0vV4Lj";
const CLOUD_TABLE="crop_yield_cloud_v1";
const CLOUD_AUTH_STORAGE_KEY="crop-yield-cloud-auth-v1";

const makeDefaultSet=()=>({
  id:'set_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
  name:'水稻测产',
  formulas:[
    {
      id:'f1',
      name:'潮粮亩产',
      unit:'公斤/亩',
      tokens:[
        {type:'var',name:'穴数/平方米'},
        {type:'op',value:'*'},
        {type:'var',name:'平均克数/穴'},
        {type:'op',value:'*'},
        {type:'num',value:667},
        {type:'op',value:'/'},
        {type:'num',value:1000}
      ]
    }
  ],
  values:{'穴数/平方米':'','平均克数/穴':''}
});

let appState=loadState();
let activeId=appState.activeId || appState.sets[0].id;
let builderTokens=[];
let cloudClient=null,cloudUser=null,cloudTimer=null,cloudBusy=false;

function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x&&Array.isArray(x.sets)&&x.sets.length)return x;
  }catch(e){}
  const s=makeDefaultSet();
  return {activeId:s.id,sets:[s],changedAt:Date.now()};
}
function saveState(){
  appState.activeId=activeId;
  appState.changedAt=Date.now();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));
  scheduleCloudSync();
}
function currentSet(){return appState.sets.find(s=>s.id===activeId)||appState.sets[0];}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderAll(){
  renderSetSelect();
  renderBuilder();
  renderFormulaList();
  renderInputs();
  renderResults();
}
function renderSetSelect(){
  const sel=document.getElementById('formulaSelect');sel.innerHTML='';
  appState.sets.forEach(s=>{
    const o=document.createElement('option');o.value=s.id;o.textContent=s.name;
    if(s.id===activeId)o.selected=true;
    sel.appendChild(o);
  });
}
function renderBuilder(){
  const box=document.getElementById('tokens');box.innerHTML='';
  if(!builderTokens.length){
    box.innerHTML='<div class="small">还没有添加内容。先输入项目名称或固定数字，然后点“添加”。</div>';
    return;
  }
  builderTokens.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='token '+(t.type==='op'?'op':t.type==='num'?'fixed':'');
    d.innerHTML=`<span>${t.type==='var'?esc(t.name):t.type==='num'?esc(t.value):t.value==='*'?'×':t.value==='/'?'÷':esc(t.value)}</span><button type="button">×</button>`;
    d.querySelector('button').onclick=()=>{builderTokens.splice(i,1);renderBuilder();};
    box.appendChild(d);
  });
}
function expressionText(tokens){
  return tokens.map(t=>t.type==='var'?'['+t.name+']':t.type==='num'?String(t.value):(t.value==='*'?'×':t.value==='/'?'÷':t.value)).join(' ');
}
function renderFormulaList(){
  const box=document.getElementById('formulaList');box.innerHTML='';
  const s=currentSet();
  if(!s.formulas.length){
    box.innerHTML='<div class="mutedbox">当前“公式名称”下面还没有建立公式。</div>';return;
  }
  s.formulas.forEach((f,i)=>{
    const d=document.createElement('div');d.className='formula-card';
    d.innerHTML=`
      <div class="formula-title">
        <strong>${esc(f.name)}</strong>
        <div>
          <button class="btn editf" type="button">编辑</button>
          <button class="btn danger delf" type="button">删除</button>
        </div>
      </div>
      <div class="formula-expression">${expressionText(f.tokens)} = ${esc(f.name)}</div>
      <div class="small">${esc(f.unit||'')}</div>`;
    d.querySelector('.delf').onclick=()=>{
      if(confirm('删除这个公式吗？')){
        s.formulas.splice(i,1);cleanupValues();saveState();renderAll();
      }
    };
    d.querySelector('.editf').onclick=()=>{
      document.getElementById('resultName').value=f.name;
      document.getElementById('resultUnit').value=f.unit||'';
      builderTokens=JSON.parse(JSON.stringify(f.tokens));
      s.formulas.splice(i,1);
      renderBuilder();renderFormulaList();renderInputs();renderResults();saveState();
      window.scrollTo({top:document.querySelector('.builder').offsetTop-20,behavior:'smooth'});
    };
    box.appendChild(d);
  });
}
function allVarNames(){
  const names=[];
  currentSet().formulas.forEach(f=>f.tokens.forEach(t=>{
    if(t.type==='var'&&!names.includes(t.name))names.push(t.name);
  }));
  return names;
}
function cleanupValues(){
  const s=currentSet();const keep=new Set(allVarNames());
  Object.keys(s.values||{}).forEach(k=>{if(!keep.has(k))delete s.values[k]});
}
function renderInputs(){
  const box=document.getElementById('inputArea');box.innerHTML='';
  const s=currentSet();s.values=s.values||{};
  const names=allVarNames();
  if(!names.length){
    box.innerHTML='<div class="mutedbox">建立公式以后，这里会自动出现需要填写的数据项。</div>';return;
  }
  names.forEach(name=>{
    const d=document.createElement('div');d.className='input-card';
    d.innerHTML=`<label>${esc(name)}</label><input type="number" step="any" inputmode="decimal" value="${esc(s.values[name]??'')}">`;
    d.querySelector('input').oninput=e=>{s.values[name]=e.target.value;saveState();renderResults();};
    box.appendChild(d);
  });
}
function evaluateFormula(f, ctx){
  let expr='';
  for(const t of f.tokens){
    if(t.type==='num')expr+=String(Number(t.value));
    else if(t.type==='op')expr+=t.value;
    else{
      const v=Number(ctx[t.name]);
      if(!Number.isFinite(v))return null;
      expr+='('+v+')';
    }
  }
  if(!expr||/[^0-9+\-*/().]/.test(expr))return null;
  try{
    const v=Function('"use strict";return ('+expr+')')();
    return Number.isFinite(v)?v:null;
  }catch(e){return null;}
}
function renderResults(){
  const box=document.getElementById('results');box.innerHTML='';
  const s=currentSet();const ctx={...s.values};
  if(!s.formulas.length){
    box.innerHTML='<div class="mutedbox">暂无计算结果。</div>';return;
  }
  s.formulas.forEach(f=>{
    const v=evaluateFormula(f,ctx);
    if(v!==null)ctx[f.name]=v;
    const d=document.createElement('div');d.className='result';
    d.innerHTML=`<div class="result-name">${esc(f.name)}</div><div class="result-value">${v===null?'—':v.toFixed(2)} <span style="font-size:14px">${esc(f.unit||'')}</span></div><div class="small">${expressionText(f.tokens)}</div>`;
    box.appendChild(d);
  });
}

document.getElementById('formulaSelect').onchange=e=>{activeId=e.target.value;saveState();renderAll();};
document.getElementById('newFormulaSet').onclick=()=>{
  const name=prompt('请输入新的公式名称：','新公式');
  if(!name)return;
  const s={id:'set_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name.trim(),formulas:[],values:{}};
  appState.sets.push(s);activeId=s.id;saveState();renderAll();
};
document.getElementById('renameFormulaSet').onclick=()=>{
  const s=currentSet();const name=prompt('重命名公式：',s.name);
  if(!name)return;s.name=name.trim();saveState();renderSetSelect();
};
document.getElementById('deleteFormulaSet').onclick=()=>{
  if(appState.sets.length<=1){alert('至少保留一个公式名称。');return;}
  const s=currentSet();
  if(!confirm('确定删除“'+s.name+'”以及下面的全部公式吗？'))return;
  appState.sets=appState.sets.filter(x=>x.id!==s.id);activeId=appState.sets[0].id;saveState();renderAll();
};
document.getElementById('addItemBtn').onclick=()=>{
  const n=document.getElementById('itemName').value.trim();
  const num=document.getElementById('fixedNumber').value.trim();
  if(n&&num){alert('项目名称和固定数字二选一即可。');return;}
  if(n){
    builderTokens.push({type:'var',name:n});
    document.getElementById('itemName').value='';
  }else if(num!==''&&!isNaN(Number(num))){
    builderTokens.push({type:'num',value:Number(num)});
    document.getElementById('fixedNumber').value='';
  }else{
    alert('请输入项目名称，或者输入固定数字。');return;
  }
  renderBuilder();
};
document.querySelectorAll('.opbtn').forEach(b=>b.onclick=()=>{
  if(!builderTokens.length||builderTokens[builderTokens.length-1].type==='op'){alert('请先添加一个项目或数字。');return;}
  builderTokens.push({type:'op',value:b.dataset.op});renderBuilder();
});
document.getElementById('clearBuilder').onclick=()=>{builderTokens=[];document.getElementById('resultName').value='';document.getElementById('resultUnit').value='';renderBuilder();};
document.getElementById('finishFormula').onclick=()=>{
  const name=document.getElementById('resultName').value.trim();
  const unit=document.getElementById('resultUnit').value.trim();
  if(!name){alert('请先填写结果名称。');return;}
  if(!builderTokens.length){alert('请先建立公式。');return;}
  if(builderTokens[builderTokens.length-1].type==='op'){alert('公式最后不能是运算符。');return;}
  const f={id:'f_'+Date.now(),name,unit,tokens:JSON.parse(JSON.stringify(builderTokens))};
  currentSet().formulas.push(f);
  currentSet().values=currentSet().values||{};
  builderTokens.forEach(t=>{if(t.type==='var'&&currentSet().values[t.name]===undefined)currentSet().values[t.name]='';});
  builderTokens=[];
  document.getElementById('resultName').value='';
  document.getElementById('resultUnit').value='';
  saveState();renderAll();
};

// Cloud sync
function setCloudStatus(msg,cls=''){
  const e=document.getElementById('cloudStatus');e.textContent=msg;e.className='status '+cls;
}
function updateCloudUI(){
  document.getElementById('cloudLogin').hidden=!!cloudUser;
  document.getElementById('cloudAccount').hidden=!cloudUser;
  document.getElementById('cloudUserText').textContent=cloudUser?'✅ 已登录：'+(cloudUser.email||'云账号'):'';
}
function scheduleCloudSync(){
  if(!cloudUser||!cloudClient)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>syncCloud(false),900);
}
async function fetchCloud(){
  const {data,error}=await cloudClient.from(CLOUD_TABLE).select('payload,updated_at').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;return data;
}
async function uploadCloud(){
  const {error}=await cloudClient.from(CLOUD_TABLE).upsert({
    user_id:cloudUser.id,
    payload:{formulaDesigner:appState},
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  if(error)throw error;
}
async function syncCloud(manual){
  if(!cloudUser||cloudBusy)return;
  cloudBusy=true;
  try{
    setCloudStatus('正在同步…');
    const row=await fetchCloud();
    const remote=row?.payload?.formulaDesigner;
    const remoteAt=Date.parse(row?.updated_at||0)||0;
    const localAt=Number(appState.changedAt)||0;
    if(!row||!remote){
      await uploadCloud();
    }else if(remoteAt>localAt+1000){
      appState=remote;
      activeId=appState.activeId||appState.sets[0].id;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));
      renderAll();
    }else{
      await uploadCloud();
    }
    setCloudStatus('✅ 已同步到云端','ok');
  }catch(e){
    console.error(e);setCloudStatus('⚠️ 同步失败：'+(e.message||'请检查网络'));
  }finally{cloudBusy=false;}
}
document.getElementById('cloudLogin').onsubmit=async e=>{
  e.preventDefault();
  const email=document.getElementById('cloudEmail').value.trim();
  const password=document.getElementById('cloudPassword').value;
  if(!email||!password){setCloudStatus('请输入邮箱和密码');return;}
  setCloudStatus('正在登录…');
  const {data,error}=await cloudClient.auth.signInWithPassword({email,password});
  if(error){setCloudStatus('登录失败：'+error.message);return;}
  cloudUser=data.session.user;document.getElementById('cloudPassword').value='';updateCloudUI();await syncCloud(true);
};
document.getElementById('syncBtn').onclick=()=>syncCloud(true);
document.getElementById('logoutBtn').onclick=async()=>{await cloudClient.auth.signOut();cloudUser=null;updateCloudUI();setCloudStatus('已退出登录，内容仍保存在本机。');};

renderAll();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
  try{
    cloudClient=window.supabase.createClient(CLOUD_PROJECT_URL,CLOUD_PUBLISHABLE_KEY,{
      auth:{storageKey:CLOUD_AUTH_STORAGE_KEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
    });
    const {data,error}=await cloudClient.auth.getSession();
    if(error)throw error;
    cloudUser=data.session?.user||null;updateCloudUI();
    if(cloudUser)await syncCloud(true);
    cloudClient.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_OUT'){cloudUser=null;updateCloudUI();}
    });
  }catch(e){console.error(e);setCloudStatus('云同步组件加载失败，本机功能仍可使用。');}
})();
</script>
</body>
</html>
