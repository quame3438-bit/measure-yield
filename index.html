<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测产公式设计器</title>
<style>
body{margin:0;background:#f5f7f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172019}
.wrap{max-width:820px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #dde5de;border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit}
button{border:1px solid #d8e0d9;background:#fff;border-radius:9px;padding:9px 11px}
button.primary{background:#2f6f45;color:#fff;border-color:#2f6f45}
button.danger{color:#b33b3b}
input,select{border:1px solid #d8e0d9;border-radius:9px;padding:10px;background:#fff}
.flex{flex:1;min-width:0}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.ops button{font-size:22px;font-weight:700}
.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:10px;border:1px dashed #bdcabc;border-radius:10px}
.token{background:#eaf3ed;border:1px solid #cfdfd4;border-radius:8px;padding:7px 9px}
.formula{border:1px solid #dfe6e0;border-radius:10px;padding:10px;margin-bottom:8px}
.formula-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.small{font-size:12px;color:#6d776f;line-height:1.5}
.input-item{border:1px solid #dfe6e0;border-radius:10px;padding:10px;margin-bottom:8px}
.result{background:#eaf3ed;border:1px solid #cadfd0;border-radius:10px;padding:10px;margin-top:8px}
.result strong{font-size:22px}
.hidden{display:none}
@media(max-width:600px){.formula-head{align-items:flex-start}.row.mobile-stack{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
<h1>测产公式设计器</h1>

<div class="card">
<h2>☁️ 云同步</h2>
<form id="cloudLogin" class="row mobile-stack">
<input id="cloudEmail" class="flex" type="email" placeholder="邮箱" autocomplete="username">
<input id="cloudPassword" class="flex" type="password" placeholder="密码" autocomplete="current-password">
<button class="primary" type="submit">登录</button>
</form>
<div id="cloudAccount" class="row hidden">
<span id="cloudUserText" class="small"></span>
<button id="syncNow" type="button">立即同步</button>
<button id="restoreBackup" type="button">恢复最近数据</button>
<button id="logoutCloud" type="button">退出登录</button>
</div>
<div id="cloudStatus" class="small" style="margin-top:8px">未登录，当前内容保存在本机。</div>
</div>

<div class="card">
<h2>公式名称</h2>
<div class="row mobile-stack">
<select id="groupSelect" class="flex"></select>
<button id="addGroup">新增</button>
<button id="renameGroup">重命名</button>
<button id="deleteGroup" class="danger">删除</button>
</div>
</div>

<div class="card">
<h2>新增公式</h2>
<div class="small">输入项目名称或固定数字，再用＋－×÷连接。已建立的公式也可以点“用于新公式”直接调用。</div>

<div class="row mobile-stack" style="margin-top:10px">
<input id="resultName" class="flex" placeholder="结果名称，例如：潮粮亩产">
<input id="resultUnit" placeholder="单位，例如：公斤/亩">
</div>

<div class="row mobile-stack" style="margin-top:10px">
<input id="itemName" class="flex" placeholder="项目名称，例如：穴数/平方米">
<input id="fixedNumber" placeholder="固定数字，例如：667" inputmode="decimal">
<button id="addPart">添加</button>
</div>

<div class="ops">
<button data-op="+">＋</button>
<button data-op="-">－</button>
<button data-op="*">×</button>
<button data-op="/">÷</button>
<button data-op="(">（</button>
<button data-op=")">）</button>
</div>

<div id="tokens" class="tokens"></div>

<div class="row" style="margin-top:10px">
<button id="finishFormula" class="primary">完成并生成</button>
<button id="cancelEdit" class="hidden" type="button">取消修改</button>
<button id="clearBuilder">清空当前</button>
</div>
</div>

<div class="card">
<h2>已建立公式</h2>
<div id="formulaList"></div>
</div>

<div class="card" id="inputDataCard">
<h2>输入数据</h2>
<div id="inputs"></div>
</div>

<div class="card">
<div class="row" style="justify-content:space-between">
<h2 style="margin:0">计算结果</h2>
<button id="calcNow" class="primary" type="button">立即计算</button>
</div>
<div id="results" style="margin-top:10px"></div>
</div>
</div>

<script>
var KEY="yield_builder_simple_v2_clean";
var LEGACY_KEYS=["yield_builder_simple_v1"];
var BACKUP_KEY="yield_builder_simple_backups_v1";
var MAX_BACKUPS=8;
var state;
var builder=[];
var editingFormulaId=null;

function uid(){return "id_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}
function defaultState(){
  var gid=uid();
  return {
    active:gid,
    groups:[{
      id:gid,
      name:"水稻测产",
      formulas:[{
        id:uid(),
        name:"潮粮亩产",
        unit:"公斤/亩",
        tokens:[
          {type:"var",name:"穴数/平方米"},
          {type:"op",value:"*"},
          {type:"var",name:"平均克数/穴"},
          {type:"op",value:"*"},
          {type:"num",value:667},
          {type:"op",value:"/"},
          {type:"num",value:1000}
        ]
      }],
      values:{"穴数/平方米":"","平均克数/穴":""}
    }]
  };
}
function cloneData(x){
  return JSON.parse(JSON.stringify(x));
}
function hasUsefulData(x){
  if(!x||!x.groups||!x.groups.length)return false;
  for(var i=0;i<x.groups.length;i++){
    var g=x.groups[i];
    if((g.formulas&&g.formulas.length)||(g.values&&Object.keys(g.values).some(function(k){
      return String(g.values[k]===undefined?"":g.values[k]).trim()!=="";
    })))return true;
  }
  return false;
}
function pushBackup(data,reason){
  if(!data||!data.groups||!data.groups.length)return;
  try{
    var arr=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]");
    if(!Array.isArray(arr))arr=[];
    arr.unshift({
      savedAt:Date.now(),
      reason:reason||"自动备份",
      state:cloneData(data)
    });
    arr=arr.slice(0,MAX_BACKUPS);
    localStorage.setItem(BACKUP_KEY,JSON.stringify(arr));
  }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var x=JSON.parse(raw);
      if(x&&x.groups&&x.groups.length)return x;
    }
  }catch(e){}

  // 自动尝试迁移旧版本数据
  for(var i=0;i<LEGACY_KEYS.length;i++){
    try{
      var oldRaw=localStorage.getItem(LEGACY_KEYS[i]);
      if(!oldRaw)continue;
      var old=JSON.parse(oldRaw);
      if(old&&old.groups&&old.groups.length){
        old.changedAt=old.changedAt||Date.now();
        localStorage.setItem(KEY,JSON.stringify(old));
        pushBackup(old,"从旧版本迁移");
        return old;
      }
    }catch(e){}
  }
  return defaultState();
}
function save(){
  try{
    var oldRaw=localStorage.getItem(KEY);
    if(oldRaw){
      var old=JSON.parse(oldRaw);
      if(old&&old.groups&&old.groups.length)pushBackup(old,"修改前自动备份");
    }
  }catch(e){}
  state.changedAt=Date.now();
  localStorage.setItem(KEY,JSON.stringify(state));
  if(typeof scheduleCloudSync==="function")scheduleCloudSync();
}
function current(){
  for(var i=0;i<state.groups.length;i++){
    if(state.groups[i].id===state.active)return state.groups[i];
  }
  state.active=state.groups[0].id;
  return state.groups[0];
}
function textOp(v){return v==="*"?"×":v==="/"?"÷":v==="("?"（":v===")"?"）":v}
function renderGroups(){
  var s=document.getElementById("groupSelect");
  s.innerHTML="";
  for(var i=0;i<state.groups.length;i++){
    var o=document.createElement("option");
    o.value=state.groups[i].id;
    o.textContent=state.groups[i].name;
    if(o.value===state.active)o.selected=true;
    s.appendChild(o);
  }
}

function updateEditModeUI(){
  var finish=document.getElementById("finishFormula");
  var cancel=document.getElementById("cancelEdit");
  if(editingFormulaId){
    finish.textContent="保存修改";
    cancel.classList.remove("hidden");
  }else{
    finish.textContent="完成并生成";
    cancel.classList.add("hidden");
  }
}
function renderBuilder(){
  updateEditModeUI();
  var box=document.getElementById("tokens");
  box.innerHTML="";
  if(!builder.length){
    box.innerHTML='<span class="small">还没有内容</span>';
    return;
  }
  for(let i=0;i<builder.length;i++){
    var t=builder[i];
    var d=document.createElement("div");
    d.className="token";
    d.textContent=t.type==="var"||t.type==="ref"?t.name:t.type==="num"?t.value:t.type==="paren"?textOp(t.value):textOp(t.value);
    d.onclick=function(){builder.splice(i,1);renderBuilder()};
    box.appendChild(d);
  }
}
function expression(tokens){
  var a=[];
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    if(t.type==="var"||t.type==="ref")a.push("["+t.name+"]");
    else if(t.type==="num")a.push(String(t.value));
    else if(t.type==="paren")a.push(textOp(t.value));
    else a.push(textOp(t.value));
  }
  return a.join(" ");
}
function findFormula(name){
  var fs=current().formulas;
  for(var i=0;i<fs.length;i++)if(fs[i].name===name)return fs[i];
  return null;
}
function evalFormula(f,ctx,seen){
  if(!f)return null;
  seen=seen||{};
  if(seen[f.name])return null;
  seen[f.name]=true;

  var infix=[];
  for(var i=0;i<f.tokens.length;i++){
    var t=f.tokens[i];

    if(t.type==="num"){
      var nv=Number(t.value);
      if(!isFinite(nv))return null;
      infix.push({kind:"num",value:nv});
    }else if(t.type==="var"){
      var rawValue=getStoredValue({values:ctx},t.name);
      if(rawValue===undefined||rawValue===null||String(rawValue).trim()==="")return null;
      var vv=Number(rawValue);
      if(!isFinite(vv))return null;
      infix.push({kind:"num",value:vv});
    }else if(t.type==="ref"){
      var rf=findFormula(t.name);
      var rv=evalFormula(rf,ctx,Object.assign({},seen));
      if(rv===null||!isFinite(rv))return null;
      infix.push({kind:"num",value:rv});
    }else if(t.type==="op"){
      infix.push({kind:"op",value:t.value});
    }else if(t.type==="paren"){
      infix.push({kind:"paren",value:t.value});
    }
  }

  var output=[];
  var ops=[];
  var prec={"+":1,"-":1,"*":2,"/":2};

  for(var j=0;j<infix.length;j++){
    var x=infix[j];

    if(x.kind==="num"){
      output.push(x);
    }else if(x.kind==="op"){
      while(ops.length){
        var top=ops[ops.length-1];
        if(top.kind==="op" && prec[top.value]>=prec[x.value]) output.push(ops.pop());
        else break;
      }
      ops.push(x);
    }else if(x.kind==="paren"&&x.value==="("){
      ops.push(x);
    }else if(x.kind==="paren"&&x.value===")"){
      var found=false;
      while(ops.length){
        var y=ops.pop();
        if(y.kind==="paren"&&y.value==="("){
          found=true;
          break;
        }
        output.push(y);
      }
      if(!found)return null;
    }
  }

  while(ops.length){
    var z=ops.pop();
    if(z.kind==="paren")return null;
    output.push(z);
  }

  var stack=[];
  for(var k=0;k<output.length;k++){
    var q=output[k];
    if(q.kind==="num"){
      stack.push(q.value);
    }else{
      if(stack.length<2)return null;
      var b=stack.pop();
      var a=stack.pop();
      var r;
      if(q.value==="+")r=a+b;
      else if(q.value==="-")r=a-b;
      else if(q.value==="*")r=a*b;
      else if(q.value==="/"){
        if(b===0)return null;
        r=a/b;
      }else return null;
      if(!isFinite(r))return null;
      stack.push(r);
    }
  }

  return stack.length===1&&isFinite(stack[0])?stack[0]:null;
}
function allVarsForFormula(f,out,seen){
  out=out||[];
  seen=seen||{};
  if(!f||seen[f.name])return out;
  seen[f.name]=true;
  for(var i=0;i<f.tokens.length;i++){
    var t=f.tokens[i];
    if(t.type==="var"&&out.indexOf(t.name)<0)out.push(t.name);
    if(t.type==="ref")allVarsForFormula(findFormula(t.name),out,seen);
  }
  return out;
}
function allVars(){
  var out=[];
  var fs=current().formulas;
  for(var i=0;i<fs.length;i++)allVarsForFormula(fs[i],out,{});
  return out;
}
function renderFormulas(){
  var box=document.getElementById("formulaList");
  box.innerHTML="";
  var g=current();
  if(!g.formulas.length){
    box.innerHTML='<div class="small">还没有建立公式</div>';
    return;
  }
  for(let i=0;i<g.formulas.length;i++){
    let f=g.formulas[i];
    let wrap=document.createElement("div");
    wrap.className="formula";

    let head=document.createElement("div");
    head.className="formula-head";

    let title=document.createElement("div");
    title.innerHTML="<strong>▶ "+f.name+"</strong><div class='small'>"+expression(f.tokens)+"</div>";
    title.style.cursor="pointer";

    let btns=document.createElement("div");
    btns.className="row";

    let upBtn=document.createElement("button");
    upBtn.textContent="上移";
    upBtn.disabled=(i===0);
    upBtn.onclick=function(e){
      e.stopPropagation();
      if(i<=0)return;
      var tmp=g.formulas[i-1];
      g.formulas[i-1]=g.formulas[i];
      g.formulas[i]=tmp;
      save();
      renderAll();
    };

    let downBtn=document.createElement("button");
    downBtn.textContent="下移";
    downBtn.disabled=(i===g.formulas.length-1);
    downBtn.onclick=function(e){
      e.stopPropagation();
      if(i>=g.formulas.length-1)return;
      var tmp=g.formulas[i+1];
      g.formulas[i+1]=g.formulas[i];
      g.formulas[i]=tmp;
      save();
      renderAll();
    };

    let useBtn=document.createElement("button");
    useBtn.textContent="用于新公式";
    useBtn.onclick=function(e){
      e.stopPropagation();
      if(builder.length){
        var last=builder[builder.length-1];
        var canAdd=(last.type==="op"||(last.type==="paren"&&last.value==="("));
        if(!canAdd){
          alert("请先选择＋－×÷");
          return;
        }
      }
      builder.push({type:"ref",name:f.name});
      renderBuilder();
    };

    let editBtn=document.createElement("button");
    editBtn.textContent="修改";
    editBtn.onclick=function(e){
      e.stopPropagation();
      editingFormulaId=f.id;
      document.getElementById("resultName").value=f.name;
      document.getElementById("resultUnit").value=f.unit||"";
      builder=JSON.parse(JSON.stringify(f.tokens));
      renderBuilder();
      document.getElementById("resultName").scrollIntoView({behavior:"smooth",block:"center"});
    };

    let delBtn=document.createElement("button");
    delBtn.textContent="删除";
    delBtn.className="danger";
    delBtn.onclick=function(e){
      e.stopPropagation();
      if(confirm("删除这个公式吗？")){
        g.formulas.splice(i,1);
        save();
        renderAll();
      }
    };

    btns.appendChild(upBtn);
    btns.appendChild(downBtn);
    btns.appendChild(useBtn);
    btns.appendChild(editBtn);
    btns.appendChild(delBtn);
    head.appendChild(title);
    head.appendChild(btns);
    wrap.appendChild(head);

    let detail=document.createElement("div");
    detail.className="hidden";
    detail.style.marginTop="10px";
    detail.style.borderTop="1px solid #e3e8e4";
    detail.style.paddingTop="10px";

    title.onclick=function(){
      if(detail.className==="hidden"){
        detail.className="";
        title.querySelector("strong").textContent="▼ "+f.name;
        renderFormulaUse(f,detail);
      }else{
        detail.className="hidden";
        title.querySelector("strong").textContent="▶ "+f.name;
      }
    };

    wrap.appendChild(detail);
    box.appendChild(wrap);
  }
}
function renderFormulaUse(f,detail){
  var g=current();
  var vars=allVarsForFormula(f,[],{});
  detail.innerHTML='<div class="small">填写数据即可直接使用这个公式</div>';

  for(let i=0;i<vars.length;i++){
    let name=vars[i];
    if(getStoredValue(g,name)==="")setStoredValue(g,name,"");
    var row=document.createElement("div");
    row.className="input-item";
    row.innerHTML="<div class='small'>"+name+"</div>";
    let inp=document.createElement("input");
    inp.type="number";
    inp.step="any";
    inp.value=getStoredValue(g,name);
    inp.style.width="100%";
    inp.style.marginTop="6px";
    function updateExpandedValue(){
      setStoredValue(g,name,inp.value);
      save();
      update();
      renderInputs();
      renderResults();
    }
    inp.oninput=updateExpandedValue;
    inp.onchange=updateExpandedValue;
    row.appendChild(inp);
    detail.appendChild(row);
  }

  var res=document.createElement("div");
  res.className="result";
  detail.appendChild(res);

  function update(){
    var v=evalFormula(f,g.values,{});
    res.innerHTML="<div class='small'>计算结果</div><strong>"+(v===null?"待输入":v.toFixed(2))+"</strong> "+(f.unit||"")+(v===null?"<div class='small'>请把上面的数据填写完整</div>":"");
  }
  update();
}
function renderInputs(){
  var box=document.getElementById("inputs");
  box.innerHTML="";
  var g=current();
  ensureFormulaInputsExist(g);
  var vars=allVars();

  if(!vars.length){
    box.innerHTML='<div class="small">建立公式后，这里会自动出现输入项</div>';
    return;
  }

  for(let i=0;i<vars.length;i++){
    let name=vars[i];
    if(g.values[name]===undefined)g.values[name]="";

    var d=document.createElement("div");
    d.className="input-item";

    var top=document.createElement("div");
    top.className="row";
    top.style.justifyContent="space-between";

    var lab=document.createElement("strong");
    lab.textContent=name;

    var buttons=document.createElement("div");
    buttons.className="row";

    var edit=document.createElement("button");
    edit.textContent="修改";
    edit.onclick=function(){
      var n=prompt("修改输入栏名称：",name);
      if(!n)return;
      n=n.trim();
      if(!n)return;

      for(var fi=0;fi<g.formulas.length;fi++){
        for(var ti=0;ti<g.formulas[fi].tokens.length;ti++){
          var t=g.formulas[fi].tokens[ti];
          if(t.type==="var"&&t.name===name)t.name=n;
        }
      }
      g.values[n]=g.values[name];
      delete g.values[name];
      save();
      renderAll();
    };

    var del=document.createElement("button");
    del.textContent="删除";
    del.className="danger";
    del.onclick=function(){
      if(!confirm("删除这个输入项吗？"))return;
      for(var fi=0;fi<g.formulas.length;fi++){
        g.formulas[fi].tokens=g.formulas[fi].tokens.filter(function(t){
          return !(t.type==="var"&&t.name===name);
        });
      }
      delete g.values[name];
      save();
      renderAll();
    };

    buttons.appendChild(edit);
    buttons.appendChild(del);
    top.appendChild(lab);
    top.appendChild(buttons);

    let inp=document.createElement("input");
    inp.type="number";
    inp.step="any";
    inp.value=g.values[name];
    inp.style.width="100%";
    inp.style.marginTop="8px";
    function updateValue(){
      setStoredValue(g,name,inp.value);
      save();
      renderResults();
    }
    inp.oninput=updateValue;
    inp.onchange=updateValue;

    d.appendChild(top);
    d.appendChild(inp);
    box.appendChild(d);
  }
}

function cleanName(name){
  return String(name===undefined||name===null?"":name).trim();
}
function getStoredValue(g,name){
  var target=cleanName(name);
  if(!g.values)g.values={};

  // 1. exact key
  if(Object.prototype.hasOwnProperty.call(g.values,name)){
    return g.values[name];
  }

  // 2. trimmed-name match, useful after rename / old data
  var keys=Object.keys(g.values);
  for(var i=0;i<keys.length;i++){
    if(cleanName(keys[i])===target){
      return g.values[keys[i]];
    }
  }
  return "";
}
function setStoredValue(g,name,value){
  var target=cleanName(name);
  if(!g.values)g.values={};

  // Reuse an existing equivalent key if present.
  var keys=Object.keys(g.values);
  for(var i=0;i<keys.length;i++){
    if(cleanName(keys[i])===target){
      g.values[keys[i]]=value;
      return;
    }
  }
  g.values[target]=value;
}
function ensureFormulaInputsExist(g){
  var vars=allVars();
  if(!g.values)g.values={};
  for(var i=0;i<vars.length;i++){
    var n=cleanName(vars[i]);
    if(n==="")continue;

    var found=false;
    var keys=Object.keys(g.values);
    for(var j=0;j<keys.length;j++){
      if(cleanName(keys[j])===n){
        found=true;
        break;
      }
    }
    if(!found)g.values[n]="";
  }
}
function missingVarsForFormula(f,g){
  var vars=allVarsForFormula(f,[],{});
  var missing=[];
  for(var i=0;i<vars.length;i++){
    var n=cleanName(vars[i]);
    var v=getStoredValue(g,n);
    if(v===undefined||v===null||String(v).trim()==="")missing.push(n);
  }
  return missing;
}

function formulaProblem(f,g){
  if(!f||!f.tokens||!f.tokens.length)return "公式为空";

  var depth=0;
  var prev=null;

  for(var i=0;i<f.tokens.length;i++){
    var t=f.tokens[i];

    if(t.type==="paren"&&t.value==="("){
      if(prev && (prev.type==="var"||prev.type==="ref"||prev.type==="num"||(prev.type==="paren"&&prev.value===")")))
        return "左括号前需要运算符";
      depth++;
    }else if(t.type==="paren"&&t.value===")"){
      if(depth<=0)return "右括号多了";
      if(!prev || prev.type==="op" || (prev.type==="paren"&&prev.value==="("))
        return "右括号前缺少内容";
      depth--;
    }else if(t.type==="op"){
      if(!prev || prev.type==="op" || (prev.type==="paren"&&prev.value==="("))
        return "运算符位置不正确";
    }else{
      if(prev && (prev.type==="var"||prev.type==="ref"||prev.type==="num"||(prev.type==="paren"&&prev.value===")")))
        return "两个项目之间需要＋－×÷";
    }
    prev=t;
  }

  if(depth!==0)return "括号不完整，请检查";
  if(prev && (prev.type==="op"||(prev.type==="paren"&&prev.value==="(")))
    return "公式结尾不完整";

  var missing=missingVarsForFormula(f,g);
  if(missing.length)return "还需填写："+missing.join("、");
  return "";
}
function renderResults(){
  var box=document.getElementById("results");
  box.innerHTML="";
  var g=current();
  ensureFormulaInputsExist(g);

  if(!g.formulas.length){
    box.innerHTML='<div class="small">暂无结果</div>';
    return;
  }

  for(let i=0;i<g.formulas.length;i++){
    let f=g.formulas[i];
    let missing=missingVarsForFormula(f,g);
    let problem=formulaProblem(f,g);
    let v=problem?null:evalFormula(f,g.values,{});

    let d=document.createElement("div");
    d.className="result";

    let valueText=v===null?"—":v.toFixed(2);
    let hint=problem?problem:(v===null?"公式暂时无法计算":"计算完成");

    d.innerHTML=
      "<div class='small'>"+f.name+"</div>"+
      "<strong>"+valueText+"</strong> "+(f.unit||"")+
      "<div class='small' style='margin-top:5px'>"+hint+"</div>";

    if(missing.length){
      let btn=document.createElement("button");
      btn.type="button";
      btn.textContent="继续添加数据";
      btn.style.marginTop="8px";
      btn.onclick=function(){
        ensureFormulaInputsExist(g);
        renderInputs();
        var card=document.getElementById("inputDataCard");
        if(card)card.scrollIntoView({behavior:"smooth",block:"start"});
      };
      d.appendChild(btn);
    }
    box.appendChild(d);
  }
}
function renderAll(){

  renderBuilder();
  renderFormulas();
  renderInputs();
  renderResults();
}

var ops=document.querySelectorAll("[data-op]");
for(var oi=0;oi<ops.length;oi++){
  ops[oi].onclick=function(){
    var v=this.getAttribute("data-op");
    var last=builder.length?builder[builder.length-1]:null;

    if(v==="("){
      if(last && (last.type==="var"||last.type==="ref"||last.type==="num"||(last.type==="paren"&&last.value===")"))){
        alert("左括号前请先选择＋－×÷");
        return;
      }
      builder.push({type:"paren",value:"("});
      renderBuilder();
      return;
    }

    if(v===")"){
      if(!last || last.type==="op" || (last.type==="paren"&&last.value==="(")){
        alert("右括号前需要有内容");
        return;
      }
      var depth=0;
      for(var bi=0;bi<builder.length;bi++){
        if(builder[bi].type==="paren"&&builder[bi].value==="(")depth++;
        if(builder[bi].type==="paren"&&builder[bi].value===")")depth--;
      }
      if(depth<=0){
        alert("请先添加左括号");
        return;
      }
      builder.push({type:"paren",value:")"});
      renderBuilder();
      return;
    }

    if(!last || last.type==="op" || (last.type==="paren"&&last.value==="(")){
      alert("请先添加项目、数字或完整括号");
      return;
    }

    builder.push({type:"op",value:v});
    renderBuilder();
  };
}

function builderProblem(tokens){
  if(!tokens||!tokens.length)return "请先建立公式";
  var depth=0;
  var prev=null;

  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];

    if(t.type==="paren"&&t.value==="("){
      if(prev && (prev.type==="var"||prev.type==="ref"||prev.type==="num"||(prev.type==="paren"&&prev.value===")")))
        return "左括号前需要运算符";
      depth++;
    }else if(t.type==="paren"&&t.value===")"){
      if(depth<=0)return "右括号多了";
      if(!prev || prev.type==="op" || (prev.type==="paren"&&prev.value==="("))
        return "右括号前缺少内容";
      depth--;
    }else if(t.type==="op"){
      if(!prev || prev.type==="op" || (prev.type==="paren"&&prev.value==="("))
        return "运算符位置不正确";
    }else{
      if(prev && (prev.type==="var"||prev.type==="ref"||prev.type==="num"||(prev.type==="paren"&&prev.value===")")))
        return "两个项目之间需要＋－×÷";
    }
    prev=t;
  }

  if(depth!==0)return "括号不完整，请检查";
  if(prev && (prev.type==="op"||(prev.type==="paren"&&prev.value==="(")))
    return "公式结尾不完整";
  return "";
}

document.getElementById("finishFormula").onclick=function(){
  var name=document.getElementById("resultName").value.trim();
  var unit=document.getElementById("resultUnit").value.trim();
  if(!name){alert("请填写结果名称");return}
  var bp=builderProblem(builder);
  if(bp){alert(bp);return}

  var g=current();

  if(editingFormulaId){
    var target=null;
    for(var i=0;i<g.formulas.length;i++){
      if(g.formulas[i].id===editingFormulaId){
        target=g.formulas[i];
        break;
      }
    }
    if(!target){
      alert("没有找到正在修改的公式，请重新选择。");
      editingFormulaId=null;
      updateEditModeUI();
      return;
    }

    var oldName=target.name;
    target.name=name;
    target.unit=unit;
    target.tokens=JSON.parse(JSON.stringify(builder));

    // 如果其他公式引用了这个结果名称，重命名时同步更新引用
    if(oldName!==name){
      for(var fi=0;fi<g.formulas.length;fi++){
        for(var ti=0;ti<g.formulas[fi].tokens.length;ti++){
          var t=g.formulas[fi].tokens[ti];
          if(t.type==="ref"&&t.name===oldName)t.name=name;
        }
      }
    }
  }else{
    g.formulas.push({
      id:uid(),
      name:name,
      unit:unit,
      tokens:JSON.parse(JSON.stringify(builder))
    });
  }

  editingFormulaId=null;
  builder=[];
  document.getElementById("resultName").value="";
  document.getElementById("resultUnit").value="";
  save();
  renderAll();
};
document.getElementById("cancelEdit").onclick=function(){
  editingFormulaId=null;
  builder=[];
  document.getElementById("resultName").value="";
  document.getElementById("resultUnit").value="";

};
document.getElementById("clearBuilder").onclick=function(){
  builder=[];
  if(!editingFormulaId){
    document.getElementById("resultName").value="";
    document.getElementById("resultUnit").value="";
  }
  renderBuilder();
};
document.getElementById("calcNow").onclick=function(){
  renderResults();
};

state=load();
renderAll();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
var CLOUD_URL="https://braarnzywbodyfdclodc.supabase.co";
var CLOUD_KEY="sb_publishable_JecnrG-198PERwUD5lFhaQ_wc0vV4Lj";
var CLOUD_TABLE="crop_yield_cloud_v1";
var cloudClient=null;
var cloudUser=null;
var cloudTimer=null;
var cloudBusy=false;
var applyingRemote=false;

function setCloudStatus(t){
  var el=document.getElementById("cloudStatus");
  if(el)el.textContent=t;
}
function updateCloudUI(){
  var login=document.getElementById("cloudLogin");
  var account=document.getElementById("cloudAccount");
  var userText=document.getElementById("cloudUserText");
  if(cloudUser){
    login.classList.add("hidden");
    account.classList.remove("hidden");
    userText.textContent="✅ 已登录："+(cloudUser.email||"云账号");
  }else{
    login.classList.remove("hidden");
    account.classList.add("hidden");
    userText.textContent="";
  }
}
function scheduleCloudSync(){
  if(applyingRemote||!cloudUser||!cloudClient)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){syncCloud(false)},1000);
}
async function fetchRemote(){
  var r=await cloudClient.from(CLOUD_TABLE)
    .select("payload,updated_at")
    .eq("user_id",cloudUser.id)
    .maybeSingle();
  if(r.error)throw r.error;
  return r.data;
}
async function uploadRemote(){
  var payload={stableDesigner:state};
  var r=await cloudClient.from(CLOUD_TABLE).upsert({
    user_id:cloudUser.id,
    payload:payload,
    updated_at:new Date().toISOString()
  },{onConflict:"user_id"});
  if(r.error)throw r.error;
}
async function applyRemoteState(remote){
  if(!remote||!remote.groups||!remote.groups.length)return false;
  applyingRemote=true;
  try{
    if(state&&state.groups&&state.groups.length)pushBackup(state,"云端覆盖前自动备份");
    state=remote;
    if(!state.active)state.active=state.groups[0].id;
    localStorage.setItem(KEY,JSON.stringify(state));
    renderAll();
  }finally{
    applyingRemote=false;
  }
  return true;
}
async function syncCloud(manual){
  if(!cloudUser||!cloudClient||cloudBusy)return;
  cloudBusy=true;
  try{
    setCloudStatus("正在同步…");
    var row=await fetchRemote();
    var remote=row&&row.payload?row.payload.stableDesigner:null;
    var remoteAt=row?Date.parse(row.updated_at||0)||0:0;
    var localAt=Number(state.changedAt)||0;

    if(!remote){
      await uploadRemote();
    }else if(!hasUsefulData(state) && hasUsefulData(remote)){
      // 新设备 / 本机空白时，自动恢复云端
      await applyRemoteState(remote);
    }else if(hasUsefulData(state)){
      // 本机已有实际数据时优先保留本机，防止云端旧数据误覆盖
      await uploadRemote();
    }else if(remoteAt>localAt+1000){
      await applyRemoteState(remote);
    }else{
      await uploadRemote();
    }
    setCloudStatus("✅ 已同步到云端");
  }catch(e){
    console.error(e);
    setCloudStatus("⚠️ 云同步失败："+(e&&e.message?e.message:"请检查网络"));
  }finally{
    cloudBusy=false;
  }
}

document.getElementById("cloudLogin").onsubmit=async function(e){
  e.preventDefault();
  if(!cloudClient){setCloudStatus("云同步组件未加载");return;}
  var email=document.getElementById("cloudEmail").value.trim();
  var password=document.getElementById("cloudPassword").value;
  if(!email||!password){setCloudStatus("请输入邮箱和密码");return;}
  setCloudStatus("正在登录…");
  var r=await cloudClient.auth.signInWithPassword({email:email,password:password});
  if(r.error){setCloudStatus("登录失败："+r.error.message);return;}
  cloudUser=r.data.session.user;
  document.getElementById("cloudPassword").value="";
  updateCloudUI();
  await syncCloud(true);
};
document.getElementById("syncNow").onclick=function(){syncCloud(true)};

document.getElementById("restoreBackup").onclick=function(){
  try{
    var arr=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]");
    if(!Array.isArray(arr)||!arr.length){
      alert("目前没有可恢复的本机备份。");
      return;
    }
    var b=arr[0];
    var t=new Date(b.savedAt).toLocaleString();
    if(!confirm("恢复最近一次备份？\\n备份时间："+t+"\\n原因："+(b.reason||"自动备份")) )return;
    pushBackup(state,"恢复备份前");
    state=cloneData(b.state);
    state.changedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(state));
    renderAll();
    setCloudStatus("✅ 已恢复最近本机备份；稍后会自动同步。");
    scheduleCloudSync();
  }catch(e){
    alert("恢复失败："+(e&&e.message?e.message:"未知错误"));
  }
};

document.getElementById("logoutCloud").onclick=async function(){
  if(cloudClient)await cloudClient.auth.signOut();
  cloudUser=null;
  updateCloudUI();
  setCloudStatus("已退出登录，内容仍保存在本机。");
};

(async function(){
  try{
    if(!window.supabase||!window.supabase.createClient){
      setCloudStatus("云同步组件未加载，本机功能仍可使用。");
      return;
    }
    cloudClient=window.supabase.createClient(CLOUD_URL,CLOUD_KEY,{
      auth:{
        storageKey:"crop-yield-stable-auth-v1",
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false
      }
    });
    var r=await cloudClient.auth.getSession();
    if(r.error)throw r.error;
    cloudUser=r.data.session?r.data.session.user:null;
    updateCloudUI();
    if(cloudUser)await syncCloud(true);

    cloudClient.auth.onAuthStateChange(function(event,session){
      if(event==="SIGNED_OUT"){
        cloudUser=null;
        updateCloudUI();
      }
    });
  }catch(e){
    console.error(e);
    setCloudStatus("云同步初始化失败，本机功能仍可使用。");
  }
})();
</script>
